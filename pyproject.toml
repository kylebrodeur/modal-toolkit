[project]
name = "modal-toolkit"
version = "1.2.1"
description = "One operator CLI for the full Modal Toolkit lifecycle: deploy, warm, doctor, shutdown, cost, and flows across all four packages"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
mtk = "toolkit.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.0.3",
    "ruff>=0.16.9",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["toolkit"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    # starlette warns through its own class; -W error in the gate turns it fatal
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]